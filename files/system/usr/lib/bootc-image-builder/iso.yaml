label: ShadowOS-LiveISO
grub2:
  default: 0
  timeout: 10
  entries:
    - name: "ShadowOS Linux Live"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=ShadowOS-LiveISO enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "ShadowOS Linux Live (Basic Graphics)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=ShadowOS-LiveISO enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
