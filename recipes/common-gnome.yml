---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - from-file: common.yml
  - from-file: flatpaks-noxfce.yml
        
  - type: dnf
    install:
      packages:
        - gnome-software
        
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        repo:
          title: Flathub (system)
        install:
          - com.mattjakeman.ExtensionManager
          - org.gnome.NautilusPreviewer
          - org.gnome.TextEditor
          - org.gnome.Showtime
          - page.tesk.Refine
          
  - type: script
    snippets:
      - "rm -rf /usr/share/gnome-shell/extensions/{tmp/,}bazaar-integration@kolunmi.github.io"
      - "ln -sf /usr/bin/gnome-software /usr/bin/bazaar"
