---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - from-file: common-flatpaks.yml
  
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      cleanup: true
      copr:
        - zeno/scrcpy
    install:
      packages:
        - yt-dlp
        - android-tools
        - scrcpy
    remove:
      packages:
        - bazaar
        - malcontent-control
        - rygel
        - Sunshine
        - btrfs-assistant
        - epiphany-runtime
        - makemkv
          
  - type: os-release
    properties:
      NAME: ShadowOS
      PRETTY_NAME: ShadowOS
      ID: shadowos
      RELEASE_TYPE: latest
      DEFAULT_HOSTNAME: shadowos
      HOME_URL: https://shadowelixir.github.io
      DOCUMENTATION_URL: https://github.com/ShadowOS-Linux/shadowos-linux
      SUPPORT_URL: https://github.com/ShadowOS-Linux/shadowos-linux/issues
      BUG_REPORT_URL: https://github.com/ShadowOS-Linux/shadowos-linux/issues
      VARIANT_ID: shadowos-linux
      BOOTLOADER_NAME: ShadowOS Linux

  - type: script
    snippets:
      - "chmod +x /usr/bin/setup-librewolf-css"
      - "rm -f /etc/skel/.config/gnome-initial-setup-done"
    scripts:
      - bloat.sh
      - uad.sh
      - scrcpy-cam.sh

  - type: initramfs
  - type: justfiles
  - type: signing
