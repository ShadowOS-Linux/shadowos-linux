---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - from-file: common.yml
  - from-file: common-nognome.yml
  
  - type: files
    files:
      - source: xfce
        destination: /

  - type: dnf
    install:
      packages:
        - xfce4-session
        - xfce4-about
        - xfce4-power-manager
        - xfce4-settings
        - xfce4-terminal
        - xfce4-screenshooter
        - xfce4-screenshooter-plugin
        - xfwm4
        - cmake
        - fakeroot
        - rpmdevtools
        - plymouth-plugin-script
        - lightdm
        - gnome-software
        - gparted
        - Thunar
    remove:
      packages:
        - gnome-disk-utility
        
  - type: script
    scripts:
      - xfce-winxp-tc.sh
      - bloat.sh

  - type: justfiles
    include:
      - toggle-autologin.just

  - type: os-release
    properties:
      VARIANT: XFCE
      VERSION_CODENAME: XFCE
      
  - type: initramfs
