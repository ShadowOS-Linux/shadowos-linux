---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - from-file: common.yml
  - from-file: common-nognome.yml
  - from-file: flatpaks-noxfce.yml
  
  - type: files
    files:
      - source: cosmic
        destination: /

  - type: dnf
    repos:
      cleanup: true
      copr:
        - ryanabx/cosmic-epoch
    install:
      packages:
        - cosmic-desktop

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: user
        repo:
          url: https://apt.pop-os.org/cosmic/cosmic.flatpakrepo
          name: cosmic
          title: Cosmic
        install:
          - io.github.avomar.cosmic-ext-applet-bitrate
          - io.github.cosmic_utils.weather-applet

  - type: script
    snippets:
      - "echo 'XDG_CURRENT_DESKTOP=COSMIC' >> /etc/environment"
      - "[ -f /etc/xdg/mimeapps.list ] && sed -i 's|application/vnd.flatpak.ref=org.gnome.Software.desktop|application/vnd.flatpak.ref=com.system76.CosmicStore.desktop|g' /etc/xdg/mimeapps.list"
    scripts:
      - bloat.sh
