---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - from-file: common.yml

  - type: files
    files:
      - source: kde
        destination: /
        
  - type: dnf
    install:
      packages:
        - gcc
        - gcc-c++
        - cmake
        - make
        - extra-cmake-modules
        - plasma-workspace-devel
        - libksysguard-devel
        - unzip
        - kvantum
        - qt6-qtmultimedia-devel
        - qt6-qt5compat-devel
        - libplasma-devel
        - qt6-qtbase-devel
        - qt6-qtwayland-devel
        - plasma-activities-devel
        - kf6-kpackage-devel
        - kf6-kglobalaccel-devel
        - qt6-qtsvg-devel
        - wayland-devel
        - plasma-wayland-protocols
        - kf6-ksvg-devel
        - kf6-kcrash-devel
        - kf6-kguiaddons-devel
        - kf6-kcmutils-devel
        - kf6-kio-devel
        - kdecoration-devel
        - kf6-ki18n-devel
        - kf6-knotifications-devel
        - kf6-kirigami-devel
        - kf6-kiconthemes-devel
        - gmp-ecm-devel
        - kf5-plasma-devel
        - libepoxy-devel
        - kwin-devel
        - kf6-karchive
        - kf6-karchive-devel
        - plasma-wayland-protocols-devel
        - qt6-qtbase-private-devel
        - kf6-knewstuff-devel
        - kf6-knotifyconfig-devel
        - kf6-attica-devel
        - kf6-krunner-devel
        - kf6-kdbusaddons-devel
        - kf6-sonnet-devel
        - plasma5support-devel
        - plasma-activities-stats-devel
        - polkit-qt6-1-devel
        - qt-devel
        - libdrm-devel
        - kf6-kitemmodels-devel
        - kf6-kstatusnotifieritem-devel
        - kf6-frameworkintegration-devel
        - plasma-discover-flatpak
        - plasma-oxygen
        
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        repo:
          title: Flathub (system)
        install:
          - org.kde.gwenview
          - org.kde.kcalc
          - org.kde.haruna

  - type: script
    snippets:
      - "[ -f /etc/xdg/mimeapps.list ] && sed -i 's|application/vnd.flatpak.ref=org.gnome.Software.desktop|application/vnd.flatpak.ref=org.kde.discover.desktop|g' /etc/xdg/mimeapps.list"
      - "[ -f /usr/share/kde-settings/kde-profile/default/xdg/krunnerrc ] && rm /usr/share/kde-settings/kde-profile/default/xdg/krunnerrc"
    scripts:
      - aerothemeplasma.sh

  - type: initramfs
