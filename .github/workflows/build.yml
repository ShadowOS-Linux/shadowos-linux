name: Build Image
on:
  schedule:
    - cron: "00 23 * * *"
      timezone: "Asia/Beirut"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    name: Generate Recipe Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Auto-Generate Recipe Matrices
        shell: bash
        run: |
          DES=("cosmic" "kde" "gnome" "xfce")
          GPUS=("base" "nvidia" "nvidia-legacy")
          STEAMS=("steam" "nosteam")

          mkdir -p recipes/variants

          for de in "${DES[@]}"; do
            for gpu in "${GPUS[@]}"; do
              for steam in "${STEAMS[@]}"; do

                if [ "$de" = "cosmic" ]; then
                  DE_NAME="linux"
                else
                  DE_NAME="$de"
                fi
                DE_DESC="${de^^}"

                GNOME_PAD=$([ "$de" != "kde" ] && echo "-gnome" || echo "")
                NVID_PAD=$([ "$gpu" = "nvidia" ] && echo "-nvidia-open" || { [ "$gpu" = "nvidia-legacy" ] && echo "-nvidia" || echo ""; })
                BASE_IMAGE="ghcr.io/ublue-os/bazzite${GNOME_PAD}${NVID_PAD}"

                IMAGE_NAME="shadowos-${DE_NAME}"
                if [ "$gpu" != "base" ]; then
                  IMAGE_NAME="${IMAGE_NAME}-${gpu}"
                fi
                if [ "$steam" = "steam" ]; then
                  IMAGE_NAME="${IMAGE_NAME}-steam"
                fi

                if [ "$gpu" = "nvidia" ]; then
                  GPU_DESC="Nvidia "
                elif [ "$gpu" = "nvidia-legacy" ]; then
                  GPU_DESC="Nvidia Legacy "
                else
                  GPU_DESC=""
                fi

                DESCRIPTION="Custom Bazzite ${GPU_DESC}image with ${DE_DESC}."

                FILE_PATH="recipes/variants/${IMAGE_NAME}.yml"
                
                echo "name: ${IMAGE_NAME}" > "$FILE_PATH"
                echo "description: ${DESCRIPTION}" >> "$FILE_PATH"
                echo "base-image: ${BASE_IMAGE}" >> "$FILE_PATH"
                echo "image-version: stable" >> "$FILE_PATH"
                echo "" >> "$FILE_PATH"
                echo "modules:" >> "$FILE_PATH"
                echo "  - from-file: common-${de}.yml" >> "$FILE_PATH"
                echo "  - from-file: common-${steam}.yml" >> "$FILE_PATH"
                echo "" >> "$FILE_PATH"
                echo "  - type: os-release" >> "$FILE_PATH"
                echo "    properties:" >> "$FILE_PATH"
                echo "      VARIANT_ID: ${IMAGE_NAME}" >> "$FILE_PATH"

              done
            done
          done

      - name: Find Recipes
        id: set-matrix
        shell: bash
        run: |
          # Only scan within the variants subdirectory from repo root context
          RECIPES=$(find recipes/variants -maxdepth 1 -name "*.yml" -type f | jq -R . | jq -cs .)
          
          echo "Generated Matrix: $RECIPES"
          echo "matrix=$RECIPES" >> $GITHUB_OUTPUT

  bluebuild:
    name: Build Custom Image
    needs: generate-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@main
        with: 
          tool-cache: true

      - name: Checkout
        uses: actions/checkout@main

      - name: Build Custom Image (First Attempt)
        id: build_attempt_1
        continue-on-error: true
        uses: blue-build/github-action@main
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          use_unstable_cli: true
          chunkah: true
          max_layers: 100

      - name: Build Custom Image (Second Attempt)
        id: build_attempt_2
        if: steps.build_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: blue-build/github-action@main
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          use_unstable_cli: true
          chunkah: true
          max_layers: 100

      - name: Build Custom Image (Third Attempt)
        id: build_attempt_3
        if: steps.build_attempt_2.outcome == 'failure'
        uses: blue-build/github-action@main
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          use_unstable_cli: true
          chunkah: true
          max_layers: 100
