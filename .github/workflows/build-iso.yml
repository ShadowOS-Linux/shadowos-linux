name: Build ISO
on:
  workflow_run:
    workflows: ["bluebuild"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  generate-iso-matrix:
    name: Generate ISO Build Matrix
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Parse Recipe Files for ISOs
        id: set-matrix
        shell: bash
        run: |
          cd recipes
          JSON_DATA=$(find * -mindepth 1 -name "*.yml" -type f | jq -R . | jq -cs '
            map({
              recipe: .,
              variant_dir: (split("/")[0]),
              filename: (split("/")[-1] | split(".yml")[0])
            })
          ')
          echo "matrix=$JSON_DATA" >> $GITHUB_OUTPUT

  build:
    name: Build ISO
    needs: generate-iso-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-iso-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@main
        with:    
          tool-cache: true

      - name: Checkout
        uses: actions/checkout@main

      - name: Generate Metadata
        id: meta
        shell: bash
        run: |
          ISO_NAME="${{ matrix.filename }}"
          echo "container_image=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "full_iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "date=$(TZ="Asia/Beirut" date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

          if [[ "${{ matrix.variant_dir }}" == "gnome" ]]; then
            echo "iso_variant=silverblue" >> $GITHUB_OUTPUT
          else
            echo "iso_variant=${{ matrix.variant_dir }}-atomic" >> $GITHUB_OUTPUT
          fi

      - name: Fetch Fedora Release
        id: clean_version
        shell: bash
        run: |
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false
          URL="https://fedoraproject.org/releases.json"

          until [ $RETRY_COUNT -ge $MAX_RETRIES ] || [ "$SUCCESS" = true ]; do
            RESPONSE=$(curl -fsSL "$URL" || echo "failed")

            if [ "$RESPONSE" != "failed" ]; then
              VERSION=$(echo "$RESPONSE" | grep -oE '"version": "[0-9]+"' | grep -oE '[0-9]+' | sort -rn | head -n 1)
              if [ -n "$VERSION" ]; then
                echo "stable_one=$VERSION" >> $GITHUB_OUTPUT
                SUCCESS=true
              fi
            else
              sleep 10
              RETRY_COUNT=$((RETRY_COUNT + 1))
            fi
          done

          if [ "$SUCCESS" = false ]; then
            exit 1
          fi

      - name: Resolve Dynamic Flatpak Refs
        id: flatpak_list
        shell: bash
        run: |
          BASE_DIR="files/flatpaks"
          REFS_STRING=""
          EXCLUDE_STRING=""

          process_file() {
            local file_path=$1
            local mode=$2
            if [ -f "$file_path" ]; then
              while IFS= read -r ID || [ -n "$ID" ]; do
                [[ -z "$ID" || "$ID" =~ ^# ]] && continue
                CLEAN_ID=$(echo "$ID" | tr -d '\r' | xargs)
                
                if [[ "$mode" == "exclude" ]]; then
                  EXCLUDE_STRING+="$CLEAN_ID "
                else
                  FULL_REF=$(curl -s "https://flathub.org/api/v2/appstream/$CLEAN_ID" | jq -r '.bundle.value // empty')
                  if [ -n "$FULL_REF" ] && [ "$FULL_REF" != "null" ]; then
                      REFS_STRING+="$FULL_REF "
                  else
                      REFS_STRING+="app/$CLEAN_ID/x86_64/stable "
                  fi
                fi
              done < "$file_path"
            fi
          }

          process_file "$BASE_DIR/app" "include"
          process_file "$BASE_DIR/runtime" "include"

          for item_path in "$BASE_DIR"/*; do
            if [ -f "$item_path" ]; then
              ITEM_NAME=$(basename "$item_path")
              
              if [[ "$ITEM_NAME" == "app" || "$ITEM_NAME" == "runtime" ]]; then
                continue
              fi
              
              if [[ "$ITEM_NAME" == -* ]]; then
                CLEAN_MATCH="${ITEM_NAME#-}"
                if [[ "${{ matrix.filename }}" == *"$CLEAN_MATCH"* ]]; then
                  process_file "$item_path" "exclude"
                fi
              else
                if [[ "${{ matrix.filename }}" == *"$ITEM_NAME"* ]]; then
                  process_file "$item_path" "include"
                fi
              fi
            fi
          done

          FINAL_REFS=""
          for ref in $REFS_STRING; do
            MATCHED=false
            for skip in $EXCLUDE_STRING; do
              if [[ "$ref" == *"$skip"* ]]; then
                MATCHED=true
                break
              fi
            done
            if [[ "$MATCHED" == false ]]; then
              FINAL_REFS+="$ref "
            fi
          done

          FINAL_REFS=$(echo "$FINAL_REFS" | xargs)
          echo "refs=$FINAL_REFS" >> $GITHUB_OUTPUT

      - name: Build ISO
        uses: jasonn3/build-container-installer@main
        id: iso_build
        with:
          arch: x86_64
          image_name: ${{ steps.meta.outputs.container_image }}
          image_repo: ghcr.io/shadowos-linux 
          image_tag: latest
          version: ${{ steps.clean_version.outputs.stable_one }}
          variant: ${{ steps.meta.outputs.iso_variant }}
          flatpak_remote_refs: ${{ steps.flatpak_list.outputs.refs }}
          iso_name: ${{ steps.meta.outputs.full_iso_name }}-f${{ steps.clean_version.outputs.stable_one }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha_short }}.iso
          enable_cache_dnf: "false"
          enable_cache_skopeo: "false"
          
      - name: Upload ISO to Job Artifacts
        uses: actions/upload-artifact@main
        with:
          path: |
            ${{ steps.iso_build.outputs.iso_path }}/${{ steps.meta.outputs.full_iso_name }}-f${{ steps.clean_version.outputs.stable_one }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha_short }}.iso
            ${{ steps.iso_build.outputs.iso_path }}/${{ steps.meta.outputs.full_iso_name }}-f${{ steps.clean_version.outputs.stable_one }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha_short }}.iso-CHECKSUM
          name: ${{ steps.meta.outputs.full_iso_name }}-f${{ steps.clean_version.outputs.stable_one }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha_short }}.zip
          retention-days: 4
          compression-level: 0
          
