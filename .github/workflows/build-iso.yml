name: Build ISO
on:
  workflow_run:
    workflows: ["bluebuild"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  generate-iso-matrix:
    name: Generate ISO Build Matrix
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Parse Recipe Files for ISOs
        id: set-matrix
        shell: bash
        run: |
          cd recipes
          JSON_DATA=$(find * -mindepth 1 -name "*.yml" -type f | jq -R . | jq -cs '
            map({
              recipe: .,
              variant_dir: (split("/")[0]),
              filename: (split("/")[-1] | split(".yml")[0])
            })
          ')
          echo "matrix=$JSON_DATA" >> $GITHUB_OUTPUT

  build:
    name: Build ISO
    needs: generate-iso-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-iso-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@main
        with:    
          tool-cache: true

      - name: Checkout
        uses: actions/checkout@main

      - name: Generate Metadata
        id: meta
        shell: bash
        run: |
          ISO_NAME="${{ matrix.filename }}"
          echo "container_image=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "date=$(TZ="Asia/Beirut" date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Fetch Fedora Release
        id: clean_version
        shell: bash
        run: |
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false
          URL="https://fedoraproject.org/releases.json"

          until [ $RETRY_COUNT -ge $MAX_RETRIES ] || [ "$SUCCESS" = true ]; do
            RESPONSE=$(curl -fsSL "$URL" || echo "failed")

            if [ "$RESPONSE" != "failed" ]; then
              VERSION=$(echo "$RESPONSE" | grep -oE '"version": "[0-9]+"' | grep -oE '[0-9]+' | sort -rn | head -n 1)
              if [ -n "$VERSION" ]; then
                echo "stable_one=$VERSION" >> $GITHUB_OUTPUT
                SUCCESS=true
              fi
            else
              sleep 10
              RETRY_COUNT=$((RETRY_COUNT + 1))
            fi
          done

          if [ "$SUCCESS" = false ]; then
            exit 1
          fi

      - name: Build Live ISO via Titanoboa
        id: build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: ghcr.io/shadowos-linux/${{ steps.meta.outputs.container_image }}:latest

      - name: Rename and Checksum ISO
        shell: bash
        run: |
          mkdir -p output
          
          TARGET_NAME="${{ steps.meta.outputs.container_image }}-f${{ steps.clean_version.outputs.stable_one }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha_short }}.iso"
          
          mv "${{ steps.build.outputs.iso-dest }}" "output/$TARGET_NAME"
          
          cd output
          sha256sum "$TARGET_NAME" | tee "$TARGET_NAME-CHECKSUM"

      - name: Upload ISO to Job Artifacts
        uses: actions/upload-artifact@main
        with:
          name: ${{ steps.meta.outputs.container_image }}-f${{ steps.clean_version.outputs.stable_one }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha_short }}.zip
          path: output/
          retention-days: 4
          compression-level: 0
